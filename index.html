<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="light">

  <div class="container">
    <!-- Header & Greeting section -->
    <header class="card">
      <div class="header-top">
        <button id="theme-toggle">🌙 Dark Mode</button>
      </div>
      <h1 id="greeting-text">Selamat Datang!</h1>
      <p id="current-datetime">Loading date & time...</p>
      
      <!-- Custom Name -->
      <div class="name-input-group">
        <input type="text" id="name-input" placeholder="Masukkan nama Anda...">
        <button id="save-name-btn">Simpan Nama</button>
      </div>
    </header>

    <!-- Focus Timer section -->
    <section class="card">
      <h2>Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      
      <!-- Custom Timer Input -->
      <div class="timer-settings">
        <label for="custom-minutes">Durasi (Menit): </label>
        <input type="number" id="custom-minutes" min="1" max="120" value="25">
        <button id="set-timer-btn">Atur Waktu</button>
      </div>

      <div class="timer-controls">
        <button id="start-btn">Start</button>
        <button id="stop-btn">Stop</button>
        <button id="reset-btn">Reset</button>
      </div>
    </section>

    <!-- To-Do List section -->
    <section class="card">
      <h2>To-Do List</h2>
      <div class="todo-input-group">
        <input type="text" id="todo-input" placeholder="Tambah tugas baru...">
        <button id="add-todo-btn">Tambah</button>
      </div>
      <div class="todo-tools">
        <button id="sort-todo-btn">Sort A-Z</button>
      </div>
      <ul id="todo-list"></ul>
    </section>

    <!-- Quick Links section -->
    <section class="card">
      <h2>Quick Links</h2>
      <div class="link-input-group">
        <input type="text" id="link-name" placeholder="Nama Situs (e.g. Google)">
        <input type="url" id="link-url" placeholder="URL (https://...)">
        <button id="add-link-btn">Tambah Link</button>
      </div>
      <div id="quick-links-container" class="links-grid"></div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
